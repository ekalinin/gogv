name: pages

# Deploys the landing page (site/) to GitHub Pages, with a WebAssembly build
# of the playground from the sources of the release tag that the page names
# (openspec/specs/landing-page). tools/site deploys nothing, with a notice,
# while that tag is not pushed or its sources have no playground.
on:
  push:
    branches: [main]
    # The push of a release tag deploys the site with the module of that
    # release. GitHub does not evaluate path filters for tag pushes.
    tags: ["v*"]
    paths:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
      # The site serves them.
      - "docs/example.svg"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The page always comes from main, also on a tag push; the history and
      # the tags are fetched for the worktree of the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no dependencies, so no go.sum to key a cache on

      - name: Assemble the site
        id: site
        run: go run ./tools/site -release -out _site

      - name: Configure Pages
        if: steps.site.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the site
        if: steps.site.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        if: steps.site.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
